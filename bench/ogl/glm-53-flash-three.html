<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rotating Torus Knot — three.js</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #050508;
    }

    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <script type="module">
    import * as THREE from 'https://esm.sh/three';

    // Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Scene (dark background)
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050508);

    // Camera
    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(0, 0, 4.2);

    // Torus knot mesh
    const geometry = new THREE.TorusKnotGeometry(1.2, 0.4, 256, 48);
    const material = new THREE.MeshNormalMaterial();
    const knot = new THREE.Mesh(geometry, material);
    scene.add(knot);

    // Handle resizing
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Animation loop — continuous rotation
    renderer.setAnimationLoop((time) => {
      knot.rotation.x = time * 0.0005;
      knot.rotation.y = time * 0.001;
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
